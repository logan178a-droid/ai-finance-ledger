<svg width="512" height="512" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Finance Ledger mark">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2E63"/>
      <stop offset="1" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C8CFF"/>
      <stop offset="1" stop-color="#4C86FF"/>
    </linearGradient>
    <radialGradient id="sheen" cx="28%" cy="18%" r="65%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="160" height="160" rx="38" fill="url(#bgGrad)"/>
  <rect width="160" height="160" rx="38" fill="url(#sheen)"/>

  <!-- thin gradient ring border -->
  <rect x="1.25" y="1.25" width="157.5" height="157.5" rx="36.75" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.55" stroke-width="1.6"/>
  <rect x="0.75" y="0.75" width="158.5" height="158.5" rx="37.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.2"/>

  <!-- ledger bars -->
  <rect x="50" y="40" width="74" height="9" rx="4.5" fill="#EDF1FB" fill-opacity="0.42"/>
  <rect x="38" y="63" width="86" height="9" rx="4.5" fill="#EDF1FB" fill-opacity="0.75"/>

  <!-- confirmed check -->
  <path d="M36 94 L65 121 L127 56" fill="none" stroke="#4C86FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI spark -->
  <path d="M130 37 C131.6 44.8 135.2 48.4 143 50 C135.2 51.6 131.6 55.2 130 63 C128.4 55.2 124.8 51.6 117 50 C124.8 48.4 128.4 44.8 130 37 Z" fill="#9C8CFF"/>
</svg>
